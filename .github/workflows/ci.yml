name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f Dockerfile.api -t flowsight-api:ci .

      - name: Build collector image
        run: docker build -f Dockerfile.collector -t flowsight-collector:ci .

  integration:
    name: Integration (InfluxDB)
    runs-on: ubuntu-latest
    services:
      influxdb:
        image: influxdb:2.7
        ports:
          - 8086:8086
        env:
          DOCKER_INFLUXDB_INIT_MODE: setup
          DOCKER_INFLUXDB_INIT_USERNAME: admin
          DOCKER_INFLUXDB_INIT_PASSWORD: password
          DOCKER_INFLUXDB_INIT_ORG: flowsight
          DOCKER_INFLUXDB_INIT_BUCKET: flows
          DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: my-super-secret-admin-token
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install ".[test]"

      - name: Wait for InfluxDB
        run: |
          timeout 90 bash -c 'until curl -fsS http://localhost:8086/health >/dev/null 2>&1; do sleep 2; done'

      - name: Run integration tests
        run: python -m pytest -m integration
        env:
          FLOWSIGHT_INFLUXDB_URL: http://localhost:8086
          FLOWSIGHT_INFLUXDB_TOKEN: my-super-secret-admin-token

  dashboard:
    name: Dashboard build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[test]"

      - name: Run tests
        run: python -m pytest

      - name: CLI entry points respond
        run: |
          flowsight-collector --help
          flowsight-api --help
          flowsight-enrich --help
          flowsight-detect --help

  lint:
    name: Ruff (core)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint tool
        run: python -m pip install ruff

      - name: Run Ruff core rules (blocking)
        run: ruff check --select E4,E7,E9,F,W,I flowsight/ tests/ scripts/generate_demo_data.py

      - name: Check formatting
        run: ruff format --check flowsight/ tests/ scripts/

  lint-strict:
    name: Ruff (strict debt tracker)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint tool
        run: python -m pip install ruff

      - name: Run Ruff strict profile (non-blocking debt counter)
        run: ruff check --exit-zero --statistics flowsight/ tests/ scripts/generate_demo_data.py

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dashboard:
    name: Dashboard build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[test]"

      - name: Run tests
        run: python -m pytest

      - name: CLI entry points respond
        run: |
          flowsight-collector --help
          flowsight-api --help
          flowsight-enrich --help
          flowsight-detect --help

  lint:
    name: Ruff (core)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint tool
        run: python -m pip install ruff

      - name: Run Ruff core rules (blocking)
        run: ruff check --select E4,E7,E9,F,W,I flowsight/ tests/ scripts/generate_demo_data.py

  lint-strict:
    name: Ruff (strict debt tracker)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint tool
        run: python -m pip install ruff

      - name: Run Ruff strict profile (non-blocking debt counter)
        run: ruff check --exit-zero --statistics flowsight/ tests/ scripts/generate_demo_data.py

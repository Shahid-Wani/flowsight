services:
  influxdb:
    image: influxdb:2.7
    container_name: flowsight-influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=password
      - DOCKER_INFLUXDB_INIT_ORG=flowsight
      - DOCKER_INFLUXDB_INIT_BUCKET=flows
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=my-super-secret-admin-token
    volumes:
      - influxdb-data:/var/lib/influxdb
      - influxdb-config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  collector:
    build:
      context: .
      dockerfile: Dockerfile.collector
    container_name: flowsight-collector
    ports:
      - "2055:2055/udp"
    environment:
      # Settings use pydantic-settings env_nested_delimiter="__":
      # overrides must use SECTION__FIELD form (flat forms are ignored).
      - COLLECTOR__LISTEN=0.0.0.0:2055
      - STORAGE__URL=http://influxdb:8086
      - STORAGE__ORG=flowsight
      - STORAGE__BUCKET=flows
      - STORAGE__TOKEN=my-super-secret-admin-token
      - LOGGING__LEVEL=INFO
    depends_on:
      influxdb:
        condition: service_healthy
    volumes:
      - ./data:/app/data:ro

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: flowsight-api
    ports:
      - "8000:8000"
    environment:
      - API__HOST=0.0.0.0
      - API__PORT=8000
      - STORAGE__URL=http://influxdb:8086
      - STORAGE__ORG=flowsight
      - STORAGE__BUCKET=flows
      - STORAGE__TOKEN=my-super-secret-admin-token
      - API__JWT_SECRET=change-me-in-production
      - LOGGING__LEVEL=INFO
    depends_on:
      influxdb:
        condition: service_healthy

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: flowsight-dashboard
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  influxdb-data:
  influxdb-config:
